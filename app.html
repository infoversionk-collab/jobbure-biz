<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1220">
  <title>求人検索｜職ブレ-Business-</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="app-page">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html"><span class="brand-mark">職</span><span class="brand-word">職ブレ<span class="brand-sub">BUSINESS</span></span></a>
    <div class="sidebar-label">WORKSPACE</div>
    <a class="side-link active" href="app.html"><span>⌕</span> 求人を探す</a>
    <button class="side-link" id="saved-filter"><span>☆</span> 保存した求人</button>
    <div class="sidebar-bottom"><div class="user-mini"><div class="user-avatar" id="user-avatar">P</div><div><b id="user-company">パートナー</b><small id="user-email">ログイン確認中</small></div></div><button id="logout-button" class="logout-link">ログアウト ↗</button></div>
  </aside>
  <main class="app-main">
    <header class="app-topbar"><button class="menu-toggle app-menu-toggle" id="sidebar-toggle">☰</button><div><div class="eyebrow">PARTNER WORKSPACE</div><h1>求人を探す</h1></div><div class="topbar-right"><span class="status-dot"></span><span>PARTNER ACCESS</span></div></header>
    <section class="app-welcome"><div><h2>次の可能性につながる求人を。</h2><p>公開中の案件を検索・確認できます。</p></div><div class="welcome-mark">職</div></section>
    <section class="search-panel">
      <div class="search-field"><span>⌕</span><input id="search-query" type="search" placeholder="求人名・職種・キーワードで検索"></div>
      <select id="business-type"><option value="">すべての事業区分</option><option value="BPO">BPO</option><option value="人材紹介">人材紹介</option></select>
      <input id="location-query" type="search" placeholder="勤務地">
      <button class="button button-primary" id="search-button">検索</button>
    </section>
    <div class="results-heading"><div><h2 id="results-title">公開中の求人</h2><p id="results-caption">条件に合う案件を表示します。</p></div><span class="results-count" id="results-count">-- 件</span></div>
    <div id="job-list" class="job-grid"><div class="empty-state"><div class="loading-spinner"></div><b>求人情報を読み込んでいます</b><p>API接続の準備ができると、ここに求人が表示されます。</p></div></div>
    <div class="app-footer">職ブレ-Business- <span>PARTNER PLATFORM</span></div>
  </main>
  <div class="modal-backdrop" id="job-modal" aria-hidden="true"><section class="job-modal"><button class="modal-close" id="modal-close">×</button><div id="job-detail"></div></section></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script>
</body>
</html>
