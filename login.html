<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1220">
  <title>ログイン｜職ブレ-Business-</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-side">
    <a class="brand brand-light" href="index.html"><span class="brand-mark">職</span><span class="brand-word">職ブレ<span class="brand-sub">BUSINESS</span></span></a>
    <div class="auth-side-copy"><div class="eyebrow">PARTNER PORTAL</div><h1>つながることで、<br><span class="gradient-text">仕事はもっと広がる。</span></h1><p>求人情報とパートナーをつなぐ、職ブレ-Business-。</p></div>
    <div class="auth-side-foot">SECURE PARTNER ACCESS <span>© SHOKUBURE</span></div>
  </div>
  <main class="auth-main">
    <a class="back-link" href="index.html">← ホームに戻る</a>
    <section class="auth-card">
      <div class="auth-card-mark">職</div>
      <div class="eyebrow">WELCOME BACK</div>
      <h2>ログイン</h2>
      <p class="auth-description">登録済みのメールアドレスとパスワードを入力してください。</p>
      <form id="login-form">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="name@example.com" required>
        <label for="password">パスワード</label>
        <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="パスワードを入力" required><button type="button" class="password-toggle" aria-label="パスワードを表示">表示</button></div>
        <div class="form-message" id="login-message" role="status"></div>
        <button class="button button-primary button-full button-large" type="submit" id="login-submit">ログイン <span>→</span></button>
      </form>
      <div class="auth-help">ログイン情報が不明な場合は、アカウント発行元の管理者へお問い合わせください。</div>
    </section>
    <div class="auth-main-foot">職ブレ-Business- <span>SECURE ACCESS</span></div>
  </main>
  <script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/auth.js"></script>
</body>
</html>
