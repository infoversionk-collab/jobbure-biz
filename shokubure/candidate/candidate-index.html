<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人・オファー｜職ブレ</title><link rel="stylesheet" href="./candidate.css"></head><body><main class="shell"><header class="top"><div><h1>職ブレ 求職者マイページ</h1><p id="welcome"></p></div><div><a class="secondary" href="./messages.html">メッセージ</a> <button class="secondary" id="logout">ログアウト</button></div></header><nav class="tabs"><button id="tab-jobs" class="active">求人を探す</button><button id="tab-apps">応募履歴</button><button id="tab-scouts">スカウト</button><button id="tab-profile">アカウント管理</button><a href="./messages.html">メッセージ</a></nav><section id="jobsPane"><section class="panel filters"><input id="q" placeholder="キーワード・職種で検索"><input id="location" placeholder="勤務地"><button id="search">検索</button></section><div id="jobs" class="job-grid"></div></section><section id="appsPane" hidden class="panel"><h2>応募履歴</h2><div id="applications"></div></section><section id="scoutsPane" hidden class="panel"><h2>企業からのスカウト</h2><div id="scouts"></div></section><section id="profilePane" class="panel" hidden><h2>アカウント管理</h2><p>履歴書・職務経歴書を登録すると、会員アカウントに紐付けて保存されます。</p><form id="profileForm"><h3>履歴書</h3><label>氏名<input id="resumeName" required></label><label>電話番号<input id="resumePhone"></label><label>生年月日<input id="resumeBirth" type="date"></label><label>最終学歴<input id="resumeEducation"></label><label>住所（公開プロフィールでは市区町村まで）<input id="resumeAddress"></label><label>資格<input id="resumeQualifications"></label><label>自己PR<textarea id="resumePr"></textarea></label><h3>職務経歴書</h3><label>職務要約<textarea id="workSummary"></textarea></label><label>職務経歴・業務内容<textarea id="workDetails"></textarea></label><label>スキル<textarea id="workSkills"></textarea></label><label class="privacy-toggle"><input id="profile-visible" type="checkbox"> 企業に匿名プロフィールを公開する（氏名・学校名・勤務先名・連絡先は公開されません）</label><p class="muted">企業へのプロフィール公開と、スカウト受信設定は別の設定です。</p><button type="submit">プロフィールを保存</button></form></section><p id="status" class="status"></p></main><dialog id="detail"><form method="dialog"><button class="close">閉じる</button></form><div id="detailContent"></div></dialog><script src="./candidate-config.js"></script><script src="./candidate.js"></script></body></html>
