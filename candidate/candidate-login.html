<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求職者ログイン｜職ブレ</title><link rel="stylesheet" href="./candidate.css"></head><body><main class="shell narrow"><header><h1>職ブレ</h1><p>求職者専用ページ</p></header><section class="panel"><h2>ログイン・会員登録</h2><p>Googleアカウントでログインしてください。初回は氏名・電話番号を登録します。</p><div id="googleButton"></div><p id="status" class="status"></p><form id="registerForm" hidden><label>氏名<input id="name" required maxlength="80"></label><label>電話番号<input id="phone" required maxlength="40" type="tel"></label><label class="consent"><input id="allowScouts" type="checkbox"> 企業からのスカウトを受け取る（任意）</label><p class="muted">チェックした場合のみ、企業の候補者検索に氏名が表示され、スカウトを受信できます。メールアドレスは企業画面に表示しません。</p><button>会員登録して求人を見る</button></form></section></main><script src="https://accounts.google.com/gsi/client" async defer></script><script src="./candidate-config.js"></script><script src="./candidate.js"></script></body></html>
