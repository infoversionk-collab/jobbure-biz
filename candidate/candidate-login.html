<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求職者ログイン｜職ブレ</title><link rel="stylesheet" href="./candidate.css"></head>
<body><main class="shell narrow"><header><h1>職ブレ</h1><p>求職者専用ページ</p></header><section class="panel"><h2>ログイン・会員登録</h2><p>応募・問い合わせにはログインが必要です。Googleアカウントでログインしてください。初回は氏名・電話番号を登録します。</p><div id="googleButton"></div><p id="status" class="status" role="status"></p><form id="registerForm" hidden><label>氏名<input id="name" required maxlength="80" autocomplete="name"></label><label>電話番号<input id="phone" required maxlength="40" type="tel" autocomplete="tel"></label><button type="submit">登録して元の求人に戻る</button></form><p class="back-link"><a href="./candidate-index.html">求人検索に戻る</a></p></section></main><script src="https://accounts.google.com/gsi/client" async defer></script><script src="./candidate-config.js"></script><script src="./candidate.js"></script></body></html>
