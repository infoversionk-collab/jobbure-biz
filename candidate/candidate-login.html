<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08152d">
  <title>求職者ログイン・会員登録｜職ブレ</title>
  <link rel="stylesheet" href="./candidate.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="cosmos">
  <main class="auth-shell">
    <a class="brand" href="./candidate-index.html"><span class="brand-mark">職</span><span>職ブレ<small>FOR JOB SEEKERS</small></span></a>
    <section class="auth-card">
      <p class="eyebrow">MEMBER ACCESS</p>
      <h1>ログイン・会員登録</h1>
      <p class="muted">求人の閲覧はログイン不要です。エントリーやオファー管理には会員登録が必要です。</p>
      <div id="googleButton" class="google-button"></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <form id="registerForm" class="form-stack" hidden>
        <div class="section-heading">
          <span class="step">01</span><div><h2>基本情報</h2><p>会員登録に必要な情報です。</p></div>
        </div>
        <label>氏名 <b class="required">必須</b><input id="name" name="name" required maxlength="80" autocomplete="name"></label>
        <label>電話番号 <b class="required">必須</b><input id="phone" name="phone" type="tel" required maxlength="40" autocomplete="tel"></label>

        <div class="section-heading">
          <span class="step">02</span><div><h2>企業からのオファー・スカウト</h2><p>希望する場合のみチェックしてください。</p></div>
        </div>
        <label class="consent-box">
          <input id="allowScouts" type="checkbox">
          <span><strong>企業からのオファー・スカウトを受け取る</strong><small>チェックした場合のみ、企業からのオファー・スカウト対象になります。チェックしない場合、企業からのオファー・スカウトは届きません。</small></span>
        </label>
        <p class="privacy-note">この設定は登録後もマイページから変更できます。応募・エントリーはこの設定に関係なく利用できます。</p>
        <button type="submit" class="primary" id="registerButton">会員登録して求人を見る</button>
      </form>
      <a class="text-link" href="./candidate-index.html">ログインせずに求人を見る</a>
    </section>
    <footer>© SHOKUBURE</footer>
  </main>
  <script src="../assets/js/config.js"></script>
  <script src="./candidate-config.js"></script>
  <script src="./candidate.js"></script>
</body>
</html>
