<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求人・オファー｜職ブレ</title><link rel="stylesheet" href="./candidate.css"></head><body><main class="shell"><header class="top"><div><h1>職ブレ 求職者マイページ</h1><p id="welcome"></p></div><div><a class="secondary" href="./messages.html">メッセージ</a> <a class="secondary" href="./candidate-login.html">会員登録・ログイン</a> <button class="secondary" id="logout">ログアウト</button></div></header><nav class="tabs" id="memberNav" hidden><button id="tab-jobs" class="active">求人を探す</button><button id="tab-apps">応募履歴</button><button id="tab-scouts">スカウト</button><button id="tab-favs">お気に入り</button><button id="tab-profile">プロフィール・書類</button><a href="./messages.html">メッセージ</a></nav><section id="jobsPane"><section class="panel filters"><input id="q" placeholder="キーワード・職種で検索"><input id="location" placeholder="勤務地"><button id="search">検索</button></section><div id="jobs" class="job-grid"></div></section><section id="appsPane" hidden class="panel"><h2>応募履歴</h2><div id="applications"></div></section><section id="scoutsPane" hidden class="panel"><h2>企業からのスカウト</h2><div id="scouts"></div></section><section id="favsPane" hidden class="panel"><h2>お気に入り求人</h2><div id="favorites"></div></section><section id="profilePane" hidden class="panel"><h2>プロフィール・応募書類</h2><p id="docReady" class="status"></p><label>氏名</label><input id="profileName"><label>電話番号</label><input id="profilePhone"><label><input type="checkbox" id="allowScoutsProfile">企業からのスカウトを受け取る</label><h3>履歴書（直接入力）</h3><div class="form-grid"><label>氏名<input id="r_name"></label><label>フリガナ<input id="r_kana"></label><label>生年月日<input id="r_birth" type="date"></label><label>住所<input id="r_address"></label><label>メールアドレス<input id="r_email" type="email"></label><label>電話番号<input id="r_phone"></label></div><label>学歴・職歴<textarea id="r_education" rows="4"></textarea></label><label>資格・免許<textarea id="r_qualifications" rows="3"></textarea></label><h3>履歴書（ファイル）</h3><p id="resumeFileStatus">ファイル未登録</p><input id="resumeUpload" type="file" accept=".pdf,.doc,.docx"><button id="uploadResume">履歴書ファイルを登録</button><hr><h3>職務経歴書（直接入力）</h3><label>職務要約<textarea id="w_summary" rows="4"></textarea></label><label>職務経歴・担当業務<textarea id="w_experience" rows="6"></textarea></label><label>スキル<textarea id="w_skills" rows="3"></textarea></label><label>実績・補足<textarea id="w_history" rows="4"></textarea></label><h3>職務経歴書（ファイル）</h3><p id="workFileStatus">ファイル未登録</p><input id="workUpload" type="file" accept=".pdf,.doc,.docx"><button id="uploadWork">職務経歴書ファイルを登録</button><p><button id="saveProfile">プロフィール・入力内容を保存</button></p><small>直接入力またはファイル登録のいずれかで、履歴書・職務経歴書の両方を用意してください。応募時に両方の登録を確認します。</small></section><p id="status" class="status"></p></main><dialog id="detail"><form method="dialog"><button class="close">閉じる</button></form><div id="detailContent"></div></dialog><script src="./candidate-config.js"></script><script src="./candidate.js"></script></body></html>
