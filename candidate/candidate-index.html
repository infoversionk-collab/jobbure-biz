<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="職ブレの公開求人検索。ログイン不要で求人を探して詳細を確認できます。"><title>求人を探す｜職ブレ</title><link rel="stylesheet" href="./candidate.css"></head>
<body><main class="shell"><header class="top"><div><a class="brand" href="../portal.html">職ブレ <small>SHOKUBURE</small></a><h1>仕事を探す</h1><p id="welcome">公開求人はログイン不要で検索・閲覧できます。</p></div><div class="account-actions"><a class="login-link" id="loginLink" href="./candidate-login.html">ログイン</a><button class="secondary" id="logout" hidden>ログアウト</button></div></header>
<section class="panel search-panel"><div><h2>あなたに合う仕事を見つけよう。</h2><p class="muted">気になる求人を選択して、仕事内容や条件を確認できます。</p></div><div class="filters"><label class="sr-only" for="q">キーワード</label><input id="q" placeholder="キーワード・職種で検索"><label class="sr-only" for="location">勤務地</label><input id="location" placeholder="勤務地"><label class="sr-only" for="employmentType">雇用形態</label><select id="employmentType"><option value="">すべての雇用形態</option><option>正社員</option><option>業務委託</option><option>アルバイト・パート</option><option>契約社員</option></select><button id="search">求人を検索</button></div></section>
<div class="results-head"><h2>公開中の求人</h2><span id="resultCount" class="muted"></span></div><div id="jobs" class="job-grid" aria-live="polite"><p class="muted">求人を読み込んでいます...</p></div><p id="status" class="status" role="status"></p>
<section class="panel member-panel" id="memberPanel" hidden><div><h2>マイページ</h2><p id="memberInfo" class="muted"></p></div><div><h3>問い合わせ履歴</h3><div id="inquiries"></div></div></section>
</main><dialog id="detail"><div class="detail-top"><span class="eyebrow">JOB DETAILS</span><button class="close" id="closeDetail" aria-label="閉じる">×</button></div><div id="detailContent"></div></dialog>
<script src="./candidate-config.js"></script><script src="./candidate.js"></script></body></html>
